name: Build FlyWithAarav app packages

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - ".github/workflows/build-flywithaarav-app.yml"

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package.json
      - name: Install app dependencies
        working-directory: app
        run: npm install
      - name: Generate Android project
        working-directory: app
        run: npx cap add android
      - name: Package website and sync native project
        working-directory: app
        run: npm run cap:android
      - name: Build debug APK for testing
        working-directory: app
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FlyWithAarav-Android-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        working-directory: app
        run: npm install
      - name: Build Windows installer
        working-directory: app
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: FlyWithAarav-Windows-installer
          path: app/dist/*.exe
          if-no-files-found: error
